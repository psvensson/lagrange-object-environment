[package]
name = "lagrange-host-linux"
version = "0.0.0"
edition = "2021"
description = "Native Linux host portability falsification (Bead hqt / ADR 0013 L1): runs the EXACT checked-in GLB renderer Component core binary (test/browser/components/glb/glb.component.wasm) under Wasmtime with native wasi:webgpu + wasi-gfx surface + lagrange:assets, with NO jco/JS/browser/DOM. A falsification spike, NOT a production Linux client."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "lagrange-host-linux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
futures = "0.3"
raw-window-handle = "0.6"
env_logger = "0.11"
log = "0.4"

# 3zb-A bounded Environment-side rquickjs embed (ADR 0014 fallback; JS WASM
# Component/WIT is preferred but upstream-blocked on async guest imports —
# ComponentizeJS #335). Features per the adversarial plan review: `loader` (ESM
# module loading via a custom embedded-source Loader), `futures` (Rust async fn
# -> JS Promise the guest awaits), `parallel` (REQUIRED so a host capability can
# resolve a JS-awaitable promise from a non-JS-owner thread; implies a tokio
# executor — already present above), `macro` (ergonomic host-function defs).
# The embed provides ONLY the tiny host-global surface the census proved the Env
# closure needs (AbortController/AbortSignal, setTimeout/clearTimeout; Promise/
# queueMicrotask/atob/btoa are QuickJS-native). NO Buffer/node:crypto/fs/process
# shim, NO Node personality. Explicit deletion criterion: remove when JS guest
# async imports land. NOT a per-language-bridge precedent.
rquickjs = { version = "0.12.2", features = ["loader", "futures", "parallel", "macro"] }

# L2b: the GTK semantic-UI realizer consumes a SemanticUi/v1 document (the SAME
# checked-in fixtures the browser DOM realizer consumes) and builds real GTK4
# controls. serde/serde_json deserialize the host-neutral description.
serde = { version = "1", features = ["derive"] }
# preserve_order: keep JSON object insertion order (the JS projector emits
# fields in insertion order; the Rust projector must match it for the
# fixture-conformance deep-equal, so serde_json::Map must be order-preserving).
serde_json = { version = "1", features = ["preserve_order"] }
gtk4 = "0.9"

# Native wasi:webgpu + wasi-gfx:surface host runtime, pinned to an EXACT git
# revision (NOT main) because the wasmtime/wgpu/wit-bindgen combination is
# tightly coupled and reproducibility matters (user direction, Bead hqt).
# This revision is the one the plan review verified pins wasi:webgpu@0.3.0-rc.2
# and wasi-gfx:surface@0.2.0 with WIT deps byte-identical to
# renderer-component/wit/deps (re-verified by diff against wit/deps here).
wasi-webgpu-wasmtime = { git = "https://github.com/wasi-gfx/wasi-gfx-runtime.git", rev = "772bc344d3d0e24ba2d3ee29fc0033fc6ccea81d" }
surface-wasmtime = { git = "https://github.com/wasi-gfx/wasi-gfx-runtime.git", rev = "772bc344d3d0e24ba2d3ee29fc0033fc6ccea81d" }

# Same versions the pinned wasi-gfx-runtime workspace pins.
wasmtime = { version = "47", features = ["component-model", "async"] }
wasmtime-wasi = "47"
wgpu-core = "29"
wgpu-types = "29"

# The pinned revision's surface-wasmtime made the surface TYPES public
# ("export custom surface types") but left `mod surface` private, so the
# generated `wasi_gfx::surface::surface` module cannot be named in a bindgen
# `with` remap (required to replace surface-webgpu with our offscreen
# realization). `wasi-webgpu-wasmtime` already exposes its generated `wasi`
# module publicly; this one-line patch (`mod surface` -> `pub mod surface`)
# gives surface-wasmtime the same reachability. NOT a behavior fork: no host
# logic changes, only module visibility. See src/lib.rs header.
[patch."https://github.com/wasi-gfx/wasi-gfx-runtime.git"]
surface-wasmtime = { path = "vendor/surface-wasmtime" }

# 0fg pin: the 3zb-A/3zb-B suites must run against the engine that fixes the
# QuickJS-NG module-linker SIGSEGV. Released rquickjs 0.12.2 bundles QuickJS-NG
# 0.15.1, which segfaults linking the real lagrange-images closure (cyclic
# re-export of an imported binding; upstream fix commit ef7a3a7, first shipped
# in QuickJS-NG 0.16.0). No released rquickjs carries a green engine (master
# still pins 0.15.1 via fd0a0210), so the pin is the EXACT revision
# 810b2b66... (which vendors quickjs-ng 2c620e4), never a floating branch.
#
# READ BEFORE "FIXING" THE URL BELOW (Bead 2rk). The URL is a PROJECT-OWNED
# MIRROR, deliberately, and the commit it serves is byte-identical to upstream.
# Revision 810b2b66... is the head of the still-open PR DelSkayn/rquickjs#723,
# whose branch lives in the THIRD-PARTY fork richarddd/rquickjs; the revision is
# on NO branch of DelSkayn/rquickjs and was reachable only as
# refs/pull/723/head. A force-push, a deleted fork or a closed PR could orphan
# it, and GitHub's retention of orphaned PR commits is best-effort -- a GC'd
# commit breaks `cargo fetch` on every fresh clone and every CI run. So:
#
#   * do NOT "restore" https://github.com/DelSkayn/rquickjs.git here;
#   * do NOT pin a branch or tag name -- the exact rev is the contract, and a
#     ref is a moving target (this is the same class of defect);
#   * do NOT change the revision to quickjs-ng's v0.16.2 tag (1ab8676f):
#     2c620e4 is what Bead 0fg actually validated green.
#
# The mirror is ARCHIVED (read-only) and public, so it stays fetchable while
# nothing can push to it; its `pinned/*` branches and all tags are additionally
# protected against deletion and force-push by repository rulesets, and the
# revision is permanently anchored by the annotated tag `lagrange-pin-810b2b66`
# even if a branch head ever moved. Archiving is not cosmetic: the mirrored
# commit necessarily carries upstream's own `.github/dependabot.yml` (deleting
# it would change the tree and therefore the pinned SHA), so GitHub began
# opening Dependabot PRs against the mirror -- including one to bump the
# `sys/quickjs` submodule off 2c620e4, precisely the thing that must never
# move. A read-only repository cannot accept them. Bead s3b retires the mirror
# when a released rquickjs ships the fix, at which point this whole
# [patch.crates-io] block is deleted.
#
# Second leg, recorded so it is not re-investigated: rquickjs vendors the engine
# as a git SUBMODULE (.gitmodules: sys/quickjs -> quickjs-ng/quickjs, pinned at
# 2c620e4), which cargo fetches too, and sys/build.rs compiles the C sources
# from that checkout -- so reachability has TWO legs. Leg 2 needs no repointing:
# 2c620e4 is ordinary ancestor history of quickjs-ng master, not a PR branch.
# It is NOT mirrored in-tree because editing .gitmodules would change the tree
# and therefore the pinned commit SHA. A project-owned recovery mirror exists at
# psvensson/quickjs-ng-pin, reachable WITHOUT editing any source via
# `CARGO_NET_GIT_FETCH_WITH_CLI=true` plus a gitconfig
# `url.<mirror>.insteadOf https://github.com/quickjs-ng/quickjs.git`
# (libgit2 does not honor insteadOf, so the git-CLI fetch path is required).
[patch.crates-io]
rquickjs = { git = "https://github.com/psvensson/rquickjs-pin.git", rev = "810b2b661ebee5f632e664fc93084f0f21258341" }
rquickjs-core = { git = "https://github.com/psvensson/rquickjs-pin.git", rev = "810b2b661ebee5f632e664fc93084f0f21258341" }
rquickjs-sys = { git = "https://github.com/psvensson/rquickjs-pin.git", rev = "810b2b661ebee5f632e664fc93084f0f21258341" }
rquickjs-macro = { git = "https://github.com/psvensson/rquickjs-pin.git", rev = "810b2b661ebee5f632e664fc93084f0f21258341" }

[workspace]
