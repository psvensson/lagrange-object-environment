[package]
name = "glb-renderer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Pinned to the same versions as the wasi-gfx-runtime examples workspace (see
# docs/renderer-component.md for the exact toolchain). Keep these in sync with
# the wasi:webgpu/wasi-gfx WIT deps under wit/deps/.
[dependencies]
wit-bindgen = { version = "0.57", features = ["futures-stream"] }
futures = "0.3"
futures-lite = "2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.25.0"
serde_json = "1"
