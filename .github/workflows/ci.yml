name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lagrange-object-environment
      - name: Check out pinned lagrange-images (sibling, for real-runtime integration tests)
        uses: actions/checkout@v4
        with:
          repository: psvensson/lagrange-images
          ref: ac12a01e7597e2d1c634658cc127a460d46f6150
          path: lagrange-images
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies including Beads native binary
        working-directory: lagrange-object-environment
        run: CI= npm install
      - working-directory: lagrange-object-environment
        run: npm test
      - name: Browser WebGPU proof (software SwiftShader, no hardware GPU, no display compositor)
        working-directory: lagrange-object-environment
        # Runs the GATING proof under Xvfb: the real triangle Component renders
        # through its exact WIT imports into a host-owned TextureRenderTarget,
        # with deterministic pixel read-back (copyTextureToBuffer) that does
        # not depend on the on-screen compositor. The on-screen canvas PIXEL
        # proof is a manual real-display test (test:browser:canvas), not CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Verify provider-independent Beads bootstrap
        shell: bash
        working-directory: lagrange-object-environment
        run: |
          set -euo pipefail
          before="$(sha256sum AGENTS.md)"
          npm run beads:init
          after="$(sha256sum AGENTS.md)"
          test "$before" = "$after"
          npx bd version
          npm run beads:prime >/dev/null
          npm run beads:ready >/dev/null

  # ADR 0013 L1: the native Linux Component host must run the EXACT checked-in
  # GLB Component binary (same sha256 the browser tests run) and render a real
  # shaded mesh — with NO jco/JS/Node/browser/DOM. This job makes the
  # portability claim CI-gating so it cannot regress while main stays green.
  # Headless offscreen (the native analogue of the browser's TextureRenderTarget
  # CI lane); the on-screen native-window proof is a separate follow-up.
  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lagrange-object-environment
      # Pin the toolchain explicitly: rust-toolchain.toml lives at hosts/linux/
      # (nested), so the action (running at repo root) might not select it;
      # wasmtime 47 needs >= 1.94. Keep this in sync with
      # hosts/linux/rust-toolchain.toml.
      - name: Install Rust toolchain (1.98.0, matches hosts/linux/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - name: Install native build + software-GPU + GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev \
            mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools \
            libgtk-4-dev xvfb
      # These four gates consume only the checked-in portable artifact. Run
      # them before a sibling checkout exists so accidental repository-tree
      # fallback is an executable CI failure, not merely a code-review claim.
      - name: Prove artifact-backed Images gates without a sibling checkout
        working-directory: lagrange-object-environment/hosts/linux
        run: |
          test ! -e "$GITHUB_WORKSPACE/lagrange-images"
          cargo test --locked \
            --test b0_portable_runtime \
            --test native_crypto_images \
            --test portable_images_observe \
            --test real_images_semantics
      - name: Prove artifact-backed real Images full GTK loop without a sibling checkout
        working-directory: lagrange-object-environment/hosts/linux
        run: |
          test ! -e "$GITHUB_WORKSPACE/lagrange-images"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            cargo test --locked --test real_images_acceptance
      # L1 (Component graphics) + L2b (GTK semantic UI). The GTK tests need
      # gtk4::init(), which requires a display — run the whole native suite
      # under Xvfb (the L1 offscreen GPU tests are unaffected by a display).
      # GTK is main-thread-only, so the GTK widget test is a single #[test].
      # --locked is load-bearing (Bead 2rk): the rquickjs pin is served from a
      # PROJECT-OWNED MIRROR whose whole purpose is that no build depends on an
      # orphanable third-party PR-head commit. Without --locked, cargo would
      # silently rewrite Cargo.lock in the CI workspace and go green even if the
      # committed lock still named the old upstream URL — so CI would pass while
      # every `--locked` consumer kept fetching the URL this pin exists to stop
      # depending on. --locked makes that a hard CI failure instead.
      # The retired 64j Node bridge was the Linux job's only sibling consumer.
      # Keep both the targeted replacement ledger and the full locked suite
      # artifact-only, with absence checked immediately before each command.
      - name: Native Linux host proof (artifact-only replacement ledger + full suite)
        working-directory: lagrange-object-environment/hosts/linux
        run: |
          test ! -e "$GITHUB_WORKSPACE/lagrange-images"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            cargo test --locked \
              --test host_runtime_structural_guard \
              --test js_env_renderer_port \
              --test l3_coexistence \
              --test js_env_acceptance \
              --test real_images_acceptance
          test ! -e "$GITHUB_WORKSPACE/lagrange-images"
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test --locked
