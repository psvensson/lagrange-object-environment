name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lagrange-object-environment
      - name: Check out lagrange-images (sibling, for the real-runtime integration tests)
        uses: actions/checkout@v4
        with:
          repository: psvensson/lagrange-images
          path: lagrange-images
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies including Beads native binary
        working-directory: lagrange-object-environment
        run: CI= npm install
      - working-directory: lagrange-object-environment
        run: npm test
      - name: Browser WebGPU proof (software SwiftShader, no hardware GPU, no display compositor)
        working-directory: lagrange-object-environment
        # Runs the GATING proof under Xvfb: the real triangle Component renders
        # through its exact WIT imports into a host-owned TextureRenderTarget,
        # with deterministic pixel read-back (copyTextureToBuffer) that does
        # not depend on the on-screen compositor. The on-screen canvas PIXEL
        # proof is a manual real-display test (test:browser:canvas), not CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Verify provider-independent Beads bootstrap
        shell: bash
        working-directory: lagrange-object-environment
        run: |
          set -euo pipefail
          before="$(sha256sum AGENTS.md)"
          npm run beads:init
          after="$(sha256sum AGENTS.md)"
          test "$before" = "$after"
          npx bd version
          npm run beads:prime >/dev/null
          npm run beads:ready >/dev/null

  # ADR 0013 L1: the native Linux Component host must run the EXACT checked-in
  # GLB Component binary (same sha256 the browser tests run) and render a real
  # shaded mesh — with NO jco/JS/Node/browser/DOM. This job makes the
  # portability claim CI-gating so it cannot regress while main stays green.
  # Headless offscreen (the native analogue of the browser's TextureRenderTarget
  # CI lane); the on-screen native-window proof is a separate follow-up.
  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain explicitly: rust-toolchain.toml lives at hosts/linux/
      # (nested), so the action (running at repo root) might not select it;
      # wasmtime 47 needs >= 1.94. Keep this in sync with
      # hosts/linux/rust-toolchain.toml.
      - name: Install Rust toolchain (1.98.0, matches hosts/linux/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - name: Install native build + software-GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev \
            mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools
      - name: Native Linux Component host proof (cargo test)
        working-directory: hosts/linux
        run: cargo test
