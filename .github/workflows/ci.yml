name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies including Beads native binary
        run: CI= npm install
      - run: npm test
      - name: Verify provider-independent Beads bootstrap
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum AGENTS.md)"
          npm run beads:init
          after="$(sha256sum AGENTS.md)"
          test "$before" = "$after"
          npx bd version
          npm run beads:prime >/dev/null
          npm run beads:ready >/dev/null
      - name: Capture Beads bootstrap metadata
        uses: actions/upload-artifact@v4
        with:
          name: beads-bootstrap
          path: .beads
          include-hidden-files: true
